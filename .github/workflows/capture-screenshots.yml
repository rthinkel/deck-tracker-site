name: Capture DeckTracker screenshots

on:
  push:
    branches:
      - main
    paths:
      - .capture-screenshots

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Check out site repository
        uses: actions/checkout@v4

      - name: Install screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot

      - name: Capture DeckTracker views after startup
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 \
            -H 'Cache-Control: no-cache' \
            "https://decktracker.r0hi.xyz/decktracker?capture=$GITHUB_SHA" \
            -o /tmp/decktracker
          chmod +x /tmp/decktracker

          mkdir -p assets/screenshots /tmp/decktracker-home /tmp/decktracker-work
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 1

          cd /tmp/decktracker-work
          HOME=/tmp/decktracker-home SDL_AUDIODRIVER=dummy /tmp/decktracker >/tmp/decktracker.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            kill "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          WID=""
          for _ in $(seq 1 60); do
            WID="$(xdotool search --onlyvisible --name 'DeckTracker' 2>/dev/null | head -n1 || true)"
            if [[ -n "$WID" ]]; then
              break
            fi
            sleep 0.25
          done
          if [[ -z "$WID" ]]; then
            cat /tmp/decktracker.log || true
            exit 1
          fi

          sleep 20
          scrot -o "$GITHUB_WORKSPACE/assets/screenshots/tracker.png"

          xdotool key --window "$WID" y
          sleep 1
          scrot -o "$GITHUB_WORKSPACE/assets/screenshots/instrument.png"

          xdotool key --window "$WID" Up
          sleep 0.25
          xdotool key --window "$WID" Return
          sleep 1
          scrot -o "$GITHUB_WORKSPACE/assets/screenshots/effects.png"

          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import hashlib
          import struct
          from pathlib import Path
          hashes = []
          for name in ('tracker.png', 'instrument.png', 'effects.png'):
              data = (Path('assets/screenshots') / name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II', data[16:24]) == (1280, 800)
              hashes.append(hashlib.sha256(data).hexdigest())
          assert len(set(hashes)) == 3, hashes
          PY

      - name: Commit corrected screenshots
        run: |
          rm -f .capture-screenshots assets/screenshots/.gitkeep assets/screenshots/README.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/screenshots .capture-screenshots
          git commit -m 'Replace splash captures with DeckTracker screenshots'
          git push
